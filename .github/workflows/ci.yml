name: ci

# Runs on pull requests only. They're tested as merged into main, the checks are required, and
# PRs land by rebase, so a second run on main would repeat the same tests.
on:
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Manifests parse
        run: python -c "import json, sys; [json.load(open(p)) for p in sys.argv[1:]]" .claude-plugin/marketplace.json plugins/compactor/.claude-plugin/plugin.json plugins/compactor/hooks/hooks.json
