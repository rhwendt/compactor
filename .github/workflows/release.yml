name: release

# On every push to main, release-please keeps a release PR up to date: it reads the
# Conventional Commits since the last tag, picks the next version, bumps every version file,
# and writes the changelog entry. Merging that PR tags the release and publishes it.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A PAT lets CI run on the release PR; with the default token, merge it with --admin.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
