body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you're trying to do, and what you've tried so far.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Optional, but helps. Your `CLAUDE_CODE_AUTO_COMPACT_WINDOW`, any `COMPACTOR_*` settings, the model and the output of `compactor status`.
      render: text
